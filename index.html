<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TeamBuilder는 참가자를 그룹으로 나누고 결과를 확인하는 도구입니다." />
    <title>TeamBuilder 2.0</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="identity">
          <div class="mark" aria-hidden="true">TB</div>
          <div>
            <p>TeamBuilder 2.0</p>
            <h1>새 배정</h1>
          </div>
        </div>
        <div class="header-actions">
          <button class="ghost-button" id="importJSONButton" type="button">설정 가져오기</button>
          <button class="ghost-button" id="exportJSONButton" type="button">설정 내보내기</button>
          <input id="settingsJSONFile" type="file" accept=".json,application/json" hidden aria-label="설정 JSON 가져오기" />
          <button class="ghost-button" id="resetButton" type="button">초기화</button>
        </div>
      </header>

      <section class="layout" aria-label="TeamBuilder 작업 공간">
        <aside class="panel input-panel" aria-label="입력">
          <section class="block">
            <div class="block-header">
              <h2>명단</h2>
              <div class="panel-actions">
                <span id="participantCount">0명</span>
                <button class="mini-button text-mini-button" id="importCSVButton" type="button" aria-label="CSV 명단 가져오기">CSV</button>
                <input id="participantCSVFile" type="file" accept=".csv,text/csv" hidden aria-label="CSV 명단 가져오기" />
              </div>
            </div>
            <label class="field">
              <span>참가자</span>
              <textarea id="participantsInput" rows="8" spellcheck="false" placeholder="A&#10;B&#10;C&#10;D" aria-describedby="participantsHelp"></textarea>
              <span class="sr-only" id="participantsHelp">줄바꿈, 쉼표, 탭으로 여러 참가자를 입력할 수 있습니다.</span>
            </label>
            <div class="preview-list" id="participantPreview" aria-label="참가자 미리보기"></div>
          </section>

          <section class="block compact-block">
            <div class="block-header">
              <h2>배정</h2>
            </div>
            <div class="assignment-grid">
              <label class="field">
                <span>그룹 수</span>
                <input id="groupCountInput" type="number" min="2" max="24" value="3" aria-describedby="groupCountHelp" />
                <span class="sr-only" id="groupCountHelp">2개 이상의 그룹 수를 입력합니다.</span>
              </label>
              <label class="field">
                <span>돌리기</span>
                <input id="rollCountInput" type="number" min="1" max="30" value="1" aria-describedby="rollCountHelp" />
                <span class="sr-only" id="rollCountHelp">여러 후보를 만든 뒤 가장 나은 결과를 반영합니다.</span>
              </label>
              <label class="field">
                <span>그룹 이름</span>
                <textarea id="groupNamesInput" rows="2" spellcheck="false" placeholder="Alpha&#10;Beta" aria-describedby="groupNamesHelp"></textarea>
                <span class="sr-only" id="groupNamesHelp">그룹 이름을 줄마다 하나씩 입력합니다.</span>
              </label>
            </div>
            <label class="field"><span>랜덤 시드 (같은 시드로 재현)</span><input id="seedInput" type="text" maxlength="256" placeholder="자동 생성" /></label>
            <label class="field">
              <span>그룹별 인원</span>
              <input id="groupCapacitiesInput" type="text" placeholder="5,5" aria-describedby="groupCapacitiesHelp" />
              <span class="sr-only" id="groupCapacitiesHelp">그룹 순서대로 인원을 쉼표로 입력합니다. 비워 두면 자동 균등 배분합니다.</span>
            </label>
          </section>

          <details class="block rules-panel" id="rulesPanel">
            <summary>규칙</summary>
            <div class="rule-grid">
              <label class="field">
                <span>함께 배정</span>
                <textarea id="togetherInput" rows="2" spellcheck="false" placeholder="A-B" aria-describedby="togetherHelp"></textarea>
                <span class="sr-only" id="togetherHelp">같은 그룹에 둘 이름을 한 줄에 입력합니다.</span>
              </label>
              <label class="field">
                <span>분리 배정</span>
                <textarea id="separateInput" rows="2" spellcheck="false" placeholder="A-B" aria-describedby="separateHelp"></textarea>
                <span class="sr-only" id="separateHelp">다른 그룹에 둘 이름을 한 줄에 입력합니다.</span>
              </label>
              <label class="field">
                <span>고정 배정</span>
                <textarea id="fixedInput" rows="2" spellcheck="false" placeholder="A=1" aria-describedby="fixedHelp"></textarea>
                <span class="sr-only" id="fixedHelp">이름과 그룹 번호를 함께 입력합니다.</span>
              </label>
              <label class="field">
                <span>속성균형</span>
                <textarea id="attributesInput" rows="2" spellcheck="false" placeholder="A=X" aria-describedby="attributesHelp"></textarea>
                <span class="sr-only" id="attributesHelp">이름과 속성 값을 함께 입력합니다.</span>
              </label>
            </div>
            <div class="nested-controls">
              <label class="checkbox-field">
                <input id="twoStageInput" type="checkbox" />
                <span>2단계 배정</span>
              </label>
              <label class="field">
                <span>역할</span>
                <input id="rolesInput" type="text" placeholder="TOP, JG, MID, ADC, SUP" disabled aria-describedby="rolesHelp" />
                <span class="sr-only" id="rolesHelp">역할은 최대 256개입니다. 필수 역할은 이름을, 선택 역할은 ?이름을 쉼표로 구분합니다.</span>
              </label>
            </div>
            <div class="control-grid"><label class="field"><span>탐색 시간 (ms)</span><input id="searchTimeInput" type="number" min="50" max="30000" value="3000" /></label><label class="field"><span>최대 연산량</span><input id="searchOperationsInput" type="number" min="100" max="10000000" value="1000000" /></label></div>
            <div class="rule-feedback" id="ruleFeedback" role="status" aria-live="polite"></div>
          </details>

          <details class="block profile-panel"><summary>참가자 역할·속성</summary>
            <label class="field"><span>참가자 선택</span><select id="profileMemberSelect"></select></label>
            <label class="field"><span>선호 역할 (선호 순서)</span><input id="profilePreferencesInput" type="text" placeholder="TOP, MID" /></label>
            <label class="field"><span>불가능한 역할</span><input id="profileRestrictionsInput" type="text" placeholder="JG, SUP" /></label>
            <label class="field"><span>반드시 맡을 역할 (선택)</span><input id="profileRequiredRoleInput" type="text" /></label>
            <label class="field"><span>속성 (항목=값, 한 줄에 하나)</span><textarea id="profileAttributesInput" placeholder="skill=5&#10;department=기획"></textarea></label>
            <button class="secondary-button" id="profileApplyButton" type="button">프로필 적용</button>
          </details>
          <details class="block weights-panel"><summary>균형 가중치</summary>
            <label class="field"><span>속성별 가중치 (기본 1, 제외 0)</span><textarea id="attributeWeightsInput" placeholder="skill=2&#10;department=1"></textarea></label>
            <label class="field"><span>역할 선호 가중치</span><input id="roleWeightInput" type="number" min="0" max="100" step="0.1" value="1" /></label>
            <button class="secondary-button" id="weightsApplyButton" type="button">가중치 적용</button>
          </details>
          <div class="action-row">
            <button class="primary-button" id="generateButton" type="button">생성</button>
            <button class="secondary-button" id="cancelButton" type="button" hidden>취소</button>
          </div>

          <progress id="generationProgress" max="1000000" value="0" hidden aria-label="배정 탐색 진행 상태"></progress>
          <span class="draft-state" id="draftState" role="status"></span>
          <p class="status-message" id="statusMessage" role="status" aria-live="polite" aria-atomic="true"></p>
        </aside>

        <section class="panel result-panel" aria-label="결과">
          <div class="result-toolbar">
            <div>
              <h2>결과</h2>
              <span id="resultState" aria-live="polite" aria-atomic="true">대기</span>
            </div>
            <div class="result-actions">
              <button class="secondary-button compact" id="undoEditButton" type="button" disabled>되돌리기</button>
              <button class="secondary-button compact" id="redoEditButton" type="button" disabled>다시 실행</button>
              <button class="secondary-button compact" id="clearLocksButton" type="button">고정 해제</button>
              <select class="copy-mode" id="copyModeSelect" aria-label="복사 형식">
                <option value="grouped">그룹명</option>
                <option value="names">이름만</option>
                <option value="numbered">번호형</option>
                <option value="chat">채팅형</option>
                <option value="compact">한줄</option>
                <option value="audit">검토 포함</option>
              </select>
              <button class="secondary-button compact" id="copyButton" type="button">복사</button>
              <button class="secondary-button compact" id="exportCSVButton" type="button" disabled>CSV 내보내기</button>
              <button class="secondary-button compact" id="exportResultJSONButton" type="button" disabled>JSON 결과</button>
            </div>
          </div>

          <div class="bulk-toolbar" role="group" aria-label="참가자 검색과 일괄 편집"><label class="field search-field"><span>결과 참가자 검색</span><input id="participantSearch" type="search" placeholder="이름·역할·속성" /></label><span id="selectionCount" role="status" aria-atomic="true">0명 선택</span><span id="searchMatchCount" class="sr-only" role="status" aria-live="polite"></span><button id="selectVisibleButton" class="secondary-button compact" type="button">검색 결과 선택/해제</button><select id="bulkTargetSelect" aria-label="일괄 이동 대상 그룹"></select><button id="bulkMoveButton" class="secondary-button compact" type="button">이동 / 선택끼리 교환</button><button id="bulkLockButton" class="secondary-button compact" type="button">선택 고정</button><button id="bulkUnlockButton" class="secondary-button compact" type="button">선택 고정 해제</button></div>
          <p class="editing-help" id="dragHelp">참가자를 그룹에 끌어 이동하거나 다른 참가자 위에 놓아 교환하세요. 이동·교환 선택창으로도 편집할 수 있습니다.</p>
          <div class="summary-strip" id="summaryStrip">
            <div>
              <span>참가자</span>
              <strong id="summaryParticipants">0</strong>
            </div>
            <div>
              <span>그룹</span>
              <strong id="summaryGroups">0</strong>
            </div>
          </div>

          <div class="summary-strip quality-strip" id="qualityStrip" hidden aria-label="배정 품질 점수"><div><span>전체</span><strong id="totalQuality">—</strong></div><div><span>속성 균형</span><strong id="balanceQuality">—</strong></div><div><span>역할 적합도</span><strong id="roleQuality">—</strong></div></div>
          <details class="candidates-panel" open><summary id="candidateSummary">후보 비교</summary><div id="resultCandidatesList" class="candidate-list"></div></details>
          <div class="empty-state" id="emptyState">
            <strong>결과 없음</strong>
          </div>

          <div class="groups-grid" id="groupsGrid" aria-label="배정 결과"></div>
        </section>

        <aside class="side-stack" aria-label="검토와 저장값">
          <section class="panel audit-panel">
            <div class="block-header">
              <h2>검토</h2>
            </div>
            <div class="audit-list" id="auditList" tabindex="0" aria-label="배정 검토 내용"></div>
          </section>

          <section class="panel saved-panel">
            <div class="block-header">
              <h2>저장값</h2>
              <div class="panel-actions">
                <span id="savedSettingsCount">0</span>
                <button class="mini-button" id="saveSettingsButton" type="button" aria-label="현재 입력 저장">+</button>
                <button class="mini-button text-mini-button" id="updateSettingsButton" type="button" aria-label="불러온 저장값 갱신">갱신</button>
              </div>
            </div>
            <input class="saved-name-input" id="savedSettingsNameInput" type="text" aria-label="저장값 이름" placeholder="저장값 이름" />
            <div class="saved-list" id="savedSettingsList"></div>
          </section>
          <section class="panel history-panel"><div class="block-header"><h2>결과 기록</h2></div><div id="resultHistoryList" class="saved-list"></div></section>
        </aside>
      </section>
    </main>

    <script src="engine.js"></script>
    <script src="script.js"></script>
  </body>
</html>
